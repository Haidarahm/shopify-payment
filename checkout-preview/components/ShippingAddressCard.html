<section class="card" aria-labelledby="shipping-title">
  <div class="card__header">
    <h2 id="shipping-title" class="card__title">Shipping Address</h2>
    <button type="button" class="icon-btn" aria-label="Add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>
  </div>
  <p class="card__subtitle">Add an address for this order</p>

  <div class="address-row" id="shipping-address-row">
    <svg class="icon icon--primary" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z" />
    </svg>
    <span id="shipping-address-text" class="skeleton-text" aria-busy="true" aria-live="polite">
      <span class="skeleton-text__line"></span>
    </span>
  </div>

  <div class="location-search" id="location-search" aria-hidden="true">
    <div class="location-search__inner">
      <input
        class="field__input location-search__input"
        id="location-search-input"
        type="search"
        placeholder="Search location"
        autocomplete="off"
        aria-controls="location-search-results"
      />
      <ul class="location-search__results" id="location-search-results" role="listbox"></ul>
    </div>
  </div>

  <button type="button" class="btn-outline" id="address-action-btn">Change Address</button>

  <div class="field" id="full-name-field">
    <label class="field__label" for="full-name">Full Name <span class="required">*</span></label>
    <input
      class="field__input"
      id="full-name"
      type="text"
      value="Al Khuwair"
      aria-describedby="full-name-error"
    />
    <p class="field__error" id="full-name-error" hidden>Full name is required</p>
  </div>

  <div class="field" id="phone-number-field">
    <label class="field__label" for="phone-number">Phone number <span class="required">*</span></label>
    <div class="phone-input">
      <span class="phone-input__prefix">
        <svg class="phone-input__flag" viewBox="0 0 20 14" aria-hidden="true">
          <rect width="20" height="14" rx="1" fill="#C8102E" />
          <rect y="4.67" width="20" height="4.66" fill="#FFFFFF" />
          <rect y="9.33" width="20" height="4.67" fill="#00843D" />
          <rect width="5" height="14" fill="#C8102E" />
        </svg>
        +968
      </span>
      <input
        class="field__input phone-input__field"
        id="phone-number"
        type="tel"
        placeholder="9XXX XXXX"
        aria-describedby="phone-number-error"
      />
    </div>
    <p class="field__error" id="phone-number-error" hidden>Phone number is required</p>
  </div>
</section>
