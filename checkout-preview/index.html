<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Preview</title>
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/checkout.css" />
  </head>
  <body>
    <main class="checkout">
      <div data-component="CheckoutHeader"></div>
      <div data-component="OrderItemsCard"></div>
      <div data-component="ShippingAddressCard"></div>
      <div data-component="OrderSummaryCard"></div>
    </main>

    <div class="location-sheet" id="location-sheet" aria-hidden="true">
      <div class="location-sheet__backdrop" id="location-sheet-backdrop"></div>
      <div
        class="location-sheet__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="location-sheet-title"
      >
        <h2 id="location-sheet-title" class="location-sheet__title">Select Location on Map</h2>
        <p class="location-sheet__subtitle">Add an location for this order</p>
        <label class="location-sheet__search" for="location-search-input">
          <svg class="location-sheet__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <input
            id="location-search-input"
            class="location-sheet__input"
            type="search"
            placeholder="Search for locations"
            autocomplete="off"
            aria-controls="location-search-results"
          />
        </label>
        <ul class="location-sheet__results" id="location-search-results" role="listbox"></ul>
      </div>
    </div>

    <div class="location-sheet" id="country-sheet" aria-hidden="true">
      <div class="location-sheet__backdrop" id="country-sheet-backdrop"></div>
      <div
        class="location-sheet__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="country-sheet-title"
      >
        <h2 id="country-sheet-title" class="location-sheet__title">Select country code</h2>
        <p class="location-sheet__subtitle">Search or pick a country for your phone number</p>
        <label class="location-sheet__search" for="country-search-input">
          <svg class="location-sheet__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <input
            id="country-search-input"
            class="location-sheet__input"
            type="search"
            placeholder="Search country or code"
            autocomplete="off"
            aria-controls="country-search-results"
          />
        </label>
        <ul class="location-sheet__results" id="country-search-results" role="listbox"></ul>
      </div>
    </div>

    <script type="module" src="./js/mount.js"></script>
  </body>
</html>
